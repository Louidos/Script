name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitHub-Release mit CHANGELOG-Abschnitt anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { f = 1; next }
            /^## / { f = 0 }
            f { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Kein CHANGELOG-Abschnitt fuer $version gefunden."; exit 1; fi
          dateien=""
          if [ -f dist/NetSetup.ps1 ]; then dateien="dist/NetSetup.ps1"; fi
          gh release create "$GITHUB_REF_NAME" $dateien --title "NetSetup $version" --notes-file notes.md
